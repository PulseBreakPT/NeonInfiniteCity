name: Career Intelligence — Fast Regression
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Syntax verification
        run: npm run check
      - name: Career intelligence tests
        run: node --test tests/career-intelligence.test.mjs tests/management-universe.test.mjs
