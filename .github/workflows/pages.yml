name: Club Dynasty — Test and Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: club-dynasty-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Football and syntax tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run check
      - run: npm test

  physics-soak:
    name: 16 complete simulated matches
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: MATCH_SOAK_COUNT=16 node tests/physics-soak.mjs

  design:
    name: Impeccable design audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Audit CSS and HTML
        shell: bash
        run: |
          set +e
          npm run --silent design:audit > impeccable-audit.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat impeccable-audit.json
            exit "$status"
          fi
          node -e "JSON.parse(require('fs').readFileSync('impeccable-audit.json','utf8'));console.log('Design scan JSON is valid')"
      - name: Save design report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: club-dynasty-impeccable-audit
          path: impeccable-audit.json
          if-no-files-found: ignore

  browser:
    name: Android and desktop Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --no-save --package-lock=false playwright-core@1.56.1
      - run: node tests/browser-smoke.mjs
      - run: node tests/browser-lineup.mjs
      - run: node tests/browser-economy.mjs
      - run: node tests/browser-live.mjs
      - run: node tests/clipping-audit.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: club-dynasty-ui-screenshots
          path: .browser-qa/
          if-no-files-found: ignore
          include-hidden-files: true

  deploy:
    name: GitHub Pages publication
    needs: [unit, physics-soak, design, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
