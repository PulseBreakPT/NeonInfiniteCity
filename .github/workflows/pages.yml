name: Club Dynasty — Test and Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check module syntax
        run: npm run check
      - name: Run football engine tests
        run: npm test
      - name: Install browser QA controller
        run: npm install --no-save --package-lock=false playwright-core@1.56.1
      - name: Validate game UI in Chromium
        run: node tests/browser-smoke.mjs
      - name: Archive game screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: club-dynasty-ui-screenshots
          path: .browser-qa/
          if-no-files-found: ignore
          include-hidden-files: true
  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
