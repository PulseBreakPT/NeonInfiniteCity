<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>500 assets · Último Abrigo</title><style>*{box-sizing:border-box}body{margin:0;background:#12211d;color:#efead5;font:15px system-ui}header{position:sticky;top:0;display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:#20362feF;border-bottom:1px solid #3f584c;padding:16px}h1{font-size:20px;margin:0}p{color:#b6c9b8;margin:3px 0}a{color:#e0cf95}select,input{background:#2c453a;border:1px solid #65796c;border-radius:8px;padding:10px;color:white;font:inherit}input{flex:1;min-width:120px}main{max-width:1360px;margin:25px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px}.tile{border:1px solid #385047;background:#20352e;border-radius:13px;text-align:center;overflow:hidden}.tile img{width:100%;aspect-ratio:1;object-fit:contain;background:radial-gradient(#344b3f,#1b2c26)}.meta{padding:9px}.meta strong{display:block;font-size:12px}.meta small{display:block;color:#b2bdad;margin:5px 0;font-size:11px}.meta a{font-size:12px}#count{font-weight:bold;color:#f0dba0}</style></head><body><header><div><h1>ÚLTIMO ABRIGO · 500 ASSETS</h1><p>Biblioteca original isométrica · SVG 128 × 128</p></div><select id="category"><option value="">Todas as categorias</option></select><input id="search" placeholder="Pesquisar assets…" aria-label="Pesquisar assets"><span id="count">500</span><a href="../../index.html">← Jogo</a></header><main><div class="grid" id="grid"></div></main><script type="module">const m=await fetch('manifest.json').then(r=>r.json()),cat=document.querySelector('#category'),q=document.querySelector('#search'),grid=document.querySelector('#grid');for(const c of new Set(m.items.map(x=>x.category))){const o=document.createElement('option');o.value=c;o.textContent=c;cat.append(o);}function draw(){let x=q.value.toLocaleLowerCase('pt-PT'),data=m.items.filter(a=>(!cat.value||a.category===cat.value)&&(!x||a.name.toLocaleLowerCase('pt-PT').includes(x)));document.querySelector('#count').textContent=data.length+' / 500';grid.replaceChildren(...data.map(a=>{const item=document.createElement('article');item.className='tile';const img=document.createElement('img');img.loading='lazy';img.src=a.file;img.alt=a.name;const d=document.createElement('div');d.className='meta';const title=document.createElement('strong');title.textContent=a.name;const sub=document.createElement('small');sub.textContent=a.category+' · '+a.key;const link=document.createElement('a');link.href=a.file;link.download=a.key+'.svg';link.textContent='Descarregar SVG ↓';d.append(title,sub,link);item.append(img,d);return item;}));}cat.addEventListener('change',draw);q.addEventListener('input',draw);draw();</script></body></html>
